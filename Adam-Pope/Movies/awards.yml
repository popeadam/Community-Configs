templates:
  Award:
    optional:
      - categories
    default:
      years: all
      winning: true
      thisyear: 2026
    imdb_award:
      event_id: <<event_id>>
      category_filter: <<categories>>
      event_year: <<years>>
      winning: <<winning>>
      sync_mode: sync
    collection_mode: hide
    collection_filtering: user
    smart_label:
      sort_by: user_rating.desc
      all:
        label: <<smart_label>>
        unplayed: true

  Latest:
    default:
      thisyear: 2026
    imdb_award:
      event_id: <<event_id>>
      event_year: <<thisyear>>
      winning: false
      sync_mode: sync
    collection_mode: hide
    collection_filtering: user
    smart_label:
      sort_by: user_rating.desc
      all:
        label: <<smart_label>>

collections:
  # ---------- Oscars ----------
  Oscars Winners:
    template:
      name: Award
      event_id: ev0000003
      categories: &oscar_cats [Best Picture, Best Motion Picture of the Year, Best Achievement in Directing, Best Director]
    summary: Unwatched Oscar-winning films for Best Picture and Best Director
    url_poster: https://raw.githubusercontent.com/Kometa-Team/Default-Images/master/award/oscars/winner.jpg
    sort_title: "!130_1_Oscars_1!"

  Oscars Nominees:
    template:
      name: Award
      event_id: ev0000003
      categories: *oscar_cats
      winning: false
    summary: Unwatched Oscar-nominated films (including winners) for Best Picture and Best Director
    url_poster: https://raw.githubusercontent.com/Kometa-Team/Default-Images/master/award/oscars/nomination.jpg
    sort_title: "!130_1_Oscars_2!"

  Oscars International Winners:
    template:
      name: Award
      event_id: ev0000003
      categories: &intl_cats [Best International Feature Film, Best Foreign Language Film]
    summary: Unwatched winners of Best Foreign Language / International Feature Film
    url_poster: https://i.ibb.co/sH8ytfm/international-feature-winners.png
    sort_title: "!130_1_Oscars_3!"

  Oscars International Nominees:
    template:
      name: Award
      event_id: ev0000003
      categories: *intl_cats
      winning: false
    summary: Unwatched nominees (including winners) of Best Foreign Language / International Feature Film
